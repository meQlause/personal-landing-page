<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#353bc8" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Ardial is a software engineer who builds products end to end, from networks and backends to blockchain and AI. See the work, the experience and the education, and get in touch."
    />
    <title>Ardial — Portfolio</title>
    <script>
      if (
        location.hash === '' &&
        performance.getEntriesByType('navigation')[0]?.type === 'reload'
      ) {
        history.scrollRestoration = 'manual';
        scrollTo(0, 0);
      }
      document.documentElement.classList.add('hero-loading');
      // Only when the script never took over: once it runs, the hero's loader releases itself.
      setTimeout(function () {
        if (!document.querySelector('.ardial-hero.is-enhanced')) {
          document.documentElement.classList.remove('hero-loading');
        }
      }, 7500);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
