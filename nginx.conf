server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # One page, no client-side routes: an unknown path is a 404, never the page (robots.txt-style requests stay honest).
    location / {
        try_files $uri $uri/ =404;
    }

    # Built assets carry a content hash in their name, so they can be cached for good.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|pdf|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
